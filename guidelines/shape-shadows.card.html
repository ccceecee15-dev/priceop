<!-- @dsCard group="Spacing" viewport="700x160" name="Elevation" subtitle="Three shadows, warm-tinted to the ground." -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;padding:18px;background:var(--dr-canvas);font-family:var(--dr-font-body);color:var(--dr-ink)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:10px}
.sw{display:flex;flex-direction:column;gap:0;flex:1;min-width:0}
.sw i{height:44px;display:block;border-radius:var(--dr-r-sm) var(--dr-r-sm) 0 0}
.sw b{font-family:var(--dr-font-mono);font-size:9.5px;font-weight:400;color:var(--dr-ink-3);padding:5px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sw em{font-style:normal;font-size:9.5px;color:var(--dr-ink-4);white-space:nowrap}
.note{font-size:11.5px;color:var(--dr-ink-3);line-height:1.5}
</style></head><body class="dr"><div class="row" style="gap:18px">
<div style="text-align:center"><div style="width:148px;height:60px;background:var(--dr-surface);border:1px solid var(--dr-line);border-radius:var(--dr-r-lg);box-shadow:var(--dr-shadow-1)"></div>
<div style="font-family:var(--dr-font-mono);font-size:10px;color:var(--dr-ink-2);margin-top:9px">shadow-1</div>
<div style="font-size:9.5px;color:var(--dr-ink-4)">resting cards, inputs</div></div><div style="text-align:center"><div style="width:148px;height:60px;background:var(--dr-surface);border:1px solid var(--dr-line);border-radius:var(--dr-r-lg);box-shadow:var(--dr-shadow-2)"></div>
<div style="font-family:var(--dr-font-mono);font-size:10px;color:var(--dr-ink-2);margin-top:9px">shadow-2</div>
<div style="font-size:9.5px;color:var(--dr-ink-4)">hover, composer</div></div><div style="text-align:center"><div style="width:148px;height:60px;background:var(--dr-surface);border:1px solid var(--dr-line);border-radius:var(--dr-r-lg);box-shadow:var(--dr-shadow-3)"></div>
<div style="font-family:var(--dr-font-mono);font-size:10px;color:var(--dr-ink-2);margin-top:9px">shadow-3</div>
<div style="font-size:9.5px;color:var(--dr-ink-4)">modals, menus</div></div>
</div>
<div class="note" style="margin-top:12px">Shadows are rgba(24,16,16,…) — warm, never neutral black. A card never gains elevation on hover beyond shadow-2.</div></body></html>
