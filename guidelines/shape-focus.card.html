<!-- @dsCard group="Spacing" viewport="700x150" name="Focus & motion" subtitle="One ring, one duration. Never the browser default." -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;padding:18px;background:var(--dr-canvas);font-family:var(--dr-font-body);color:var(--dr-ink)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:10px}
.sw{display:flex;flex-direction:column;gap:0;flex:1;min-width:0}
.sw i{height:44px;display:block;border-radius:var(--dr-r-sm) var(--dr-r-sm) 0 0}
.sw b{font-family:var(--dr-font-mono);font-size:9.5px;font-weight:400;color:var(--dr-ink-3);padding:5px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sw em{font-style:normal;font-size:9.5px;color:var(--dr-ink-4);white-space:nowrap}
.note{font-size:11.5px;color:var(--dr-ink-3);line-height:1.5}
</style></head><body class="dr"><div class="row" style="gap:16px;align-items:center">
<button class="dr-btn dr-btn--primary" style="box-shadow:var(--dr-ring)">Focused</button>
<input class="dr-input" value="Focused field" style="width:180px;border-color:var(--dr-action);box-shadow:var(--dr-ring)">
<div><div style="font-family:var(--dr-font-mono);font-size:10px;color:var(--dr-ink-2)">--dr-ring</div>
<div style="font-size:10px;color:var(--dr-ink-4)">0 0 0 3px rgba(42,37,34,.24)</div>
<div style="font-family:var(--dr-font-mono);font-size:10px;color:var(--dr-ink-2);margin-top:6px">--dr-t</div>
<div style="font-size:10px;color:var(--dr-ink-4)">140ms cubic-bezier(.4,0,.2,1)</div></div>
</div>
<div class="note" style="margin-top:12px">The ring is graphite, matching commit actions rather than the copper identity. Every transition uses the single 140ms token; <code style="font-family:var(--dr-font-mono)">prefers-reduced-motion</code> reduces all of them to 0.01ms.</div></body></html>
