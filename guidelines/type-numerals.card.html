<!-- @dsCard group="Type" viewport="700x160" name="Tabular figures" subtitle="Any number in a column carries .dr-num." -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;padding:18px;background:var(--dr-canvas);font-family:var(--dr-font-body);color:var(--dr-ink)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:10px}
.sw{display:flex;flex-direction:column;gap:0;flex:1;min-width:0}
.sw i{height:44px;display:block;border-radius:var(--dr-r-sm) var(--dr-r-sm) 0 0}
.sw b{font-family:var(--dr-font-mono);font-size:9.5px;font-weight:400;color:var(--dr-ink-3);padding:5px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sw em{font-style:normal;font-size:9.5px;color:var(--dr-ink-4);white-space:nowrap}
.note{font-size:11.5px;color:var(--dr-ink-3);line-height:1.5}
</style></head><body class="dr"><div class="row" style="gap:34px;align-items:flex-start">
<div><div class="dr-stat__label">Without .dr-num</div>
<div style="font-family:var(--dr-font-display);font-size:24px;font-weight:600;line-height:1.35">1,241,908<br>417,332<br>96,410</div></div>
<div><div class="dr-stat__label">With .dr-num</div>
<div class="dr-num" style="font-family:var(--dr-font-display);font-size:24px;font-weight:600;line-height:1.35">1,241,908<br>417,332<br>96,410</div></div>
</div>
<div class="note" style="margin-top:10px">Proportional digits make a column ragged and a changing KPI jitter. Tabular figures are mandatory in tables, KPI values, deltas and meter readouts.</div></body></html>
