<!-- @dsCard group="Type" viewport="700x180" name="Poppins — display" subtitle="Headings, KPI figures, card titles." -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;padding:18px;background:var(--dr-canvas);font-family:var(--dr-font-body);color:var(--dr-ink)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:10px}
.sw{display:flex;flex-direction:column;gap:0;flex:1;min-width:0}
.sw i{height:44px;display:block;border-radius:var(--dr-r-sm) var(--dr-r-sm) 0 0}
.sw b{font-family:var(--dr-font-mono);font-size:9.5px;font-weight:400;color:var(--dr-ink-3);padding:5px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sw em{font-style:normal;font-size:9.5px;color:var(--dr-ink-4);white-space:nowrap}
.note{font-size:11.5px;color:var(--dr-ink-3);line-height:1.5}
</style></head><body class="dr"><div style="font-family:var(--dr-font-display);font-weight:600;letter-spacing:-.015em;line-height:1.1">
<div style="font-size:32px">Data readiness, measured</div>
<div style="font-size:19px;margin-top:8px">Topbar title · 19px / 600</div>
<div style="font-size:15px;margin-top:6px;font-weight:600">Card head · 15px / 600</div>
</div>
<div class="note" style="margin-top:12px">Poppins 500/600/700 only. Tracking is −0.015em at every size — headings are set tight. Never use Poppins for body copy or table cells.</div></body></html>
