<!-- @dsCard group="Type" viewport="700x150" name="JetBrains Mono — identifiers" subtitle="IDs, shortcuts, anything the user might copy." -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;padding:18px;background:var(--dr-canvas);font-family:var(--dr-font-body);color:var(--dr-ink)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:10px}
.sw{display:flex;flex-direction:column;gap:0;flex:1;min-width:0}
.sw i{height:44px;display:block;border-radius:var(--dr-r-sm) var(--dr-r-sm) 0 0}
.sw b{font-family:var(--dr-font-mono);font-size:9.5px;font-weight:400;color:var(--dr-ink-3);padding:5px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sw em{font-style:normal;font-size:9.5px;color:var(--dr-ink-4);white-space:nowrap}
.note{font-size:11.5px;color:var(--dr-ink-3);line-height:1.5}
</style></head><body class="dr"><div class="row" style="gap:14px">
<span class="dr-kbd">⌘K</span><span class="dr-kbd">Esc</span><span class="dr-kbd">⇧↵</span>
<code style="font-family:var(--dr-font-mono);font-size:12.5px;color:var(--dr-ink-2)">style_2809424</code>
<code style="font-family:var(--dr-font-mono);font-size:12.5px;color:var(--dr-ink-2)">proj_margin &gt;= cost * 1.30</code>
</div>
<div class="note" style="margin-top:14px">Mono marks things that are machine-readable — SKU codes, rule expressions, keyboard shortcuts. It is never used for prose, and never for numbers in a column (those use <code style="font-family:var(--dr-font-mono)">.dr-num</code> on Inter).</div></body></html>
