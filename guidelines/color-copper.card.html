<!-- @dsCard group="Colors" viewport="700x150" name="Copper — identity & selection" subtitle="The brand ramp. Never a commit action." -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;padding:18px;background:var(--dr-canvas);font-family:var(--dr-font-body);color:var(--dr-ink)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:10px}
.sw{display:flex;flex-direction:column;gap:0;flex:1;min-width:0}
.sw i{height:44px;display:block;border-radius:var(--dr-r-sm) var(--dr-r-sm) 0 0}
.sw b{font-family:var(--dr-font-mono);font-size:9.5px;font-weight:400;color:var(--dr-ink-3);padding:5px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sw em{font-style:normal;font-size:9.5px;color:var(--dr-ink-4);white-space:nowrap}
.note{font-size:11.5px;color:var(--dr-ink-3);line-height:1.5}
</style></head><body class="dr"><div class="row" style="gap:4px;align-items:stretch"><div class="sw"><i style="background:var(--dr-copper-050)"></i><b>050</b></div><div class="sw"><i style="background:var(--dr-copper-100)"></i><b>100</b></div><div class="sw"><i style="background:var(--dr-copper-200)"></i><b>200</b></div><div class="sw"><i style="background:var(--dr-copper-300)"></i><b>300</b></div><div class="sw"><i style="background:var(--dr-copper-400)"></i><b>400</b></div><div class="sw"><i style="background:var(--dr-copper-500)"></i><b>500</b><em>brand core</em></div><div class="sw"><i style="background:var(--dr-copper-600)"></i><b>600</b></div><div class="sw"><i style="background:var(--dr-copper-700)"></i><b>700</b><em>links 5.3:1</em></div><div class="sw"><i style="background:var(--dr-copper-800)"></i><b>800</b><em>6.6:1</em></div><div class="sw"><i style="background:var(--dr-copper-900)"></i><b>900</b></div></div><div class="note" style="margin-top:10px">Sampled from the logo. <b style="font-family:inherit;color:var(--dr-copper-700)">500</b> is identity only — it reaches 3.4:1 on white and cannot carry small text. Step down to 700 for links, 800 for emphasis.</div></body></html>
