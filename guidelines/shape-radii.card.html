<!-- @dsCard group="Spacing" viewport="700x150" name="Radii" subtitle="Four steps, assigned by component class." -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;padding:18px;background:var(--dr-canvas);font-family:var(--dr-font-body);color:var(--dr-ink)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:10px}
.sw{display:flex;flex-direction:column;gap:0;flex:1;min-width:0}
.sw i{height:44px;display:block;border-radius:var(--dr-r-sm) var(--dr-r-sm) 0 0}
.sw b{font-family:var(--dr-font-mono);font-size:9.5px;font-weight:400;color:var(--dr-ink-3);padding:5px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sw em{font-style:normal;font-size:9.5px;color:var(--dr-ink-4);white-space:nowrap}
.note{font-size:11.5px;color:var(--dr-ink-3);line-height:1.5}
</style></head><body class="dr"><div class="row" style="gap:16px;align-items:flex-end">
<div style="text-align:center"><div style="width:104px;height:56px;background:var(--dr-surface);border:1px solid var(--dr-line-2);border-radius:var(--dr-r-sm)"></div>
<div style="font-family:var(--dr-font-mono);font-size:10px;color:var(--dr-ink-2);margin-top:6px">6px</div>
<div style="font-size:9.5px;color:var(--dr-ink-4);max-width:104px;line-height:1.3">controls, buttons, inputs</div></div><div style="text-align:center"><div style="width:104px;height:56px;background:var(--dr-surface);border:1px solid var(--dr-line-2);border-radius:var(--dr-r)"></div>
<div style="font-family:var(--dr-font-mono);font-size:10px;color:var(--dr-ink-2);margin-top:6px">10px</div>
<div style="font-size:9.5px;color:var(--dr-ink-4);max-width:104px;line-height:1.3">callouts, menus, choices</div></div><div style="text-align:center"><div style="width:104px;height:56px;background:var(--dr-surface);border:1px solid var(--dr-line-2);border-radius:var(--dr-r-lg)"></div>
<div style="font-family:var(--dr-font-mono);font-size:10px;color:var(--dr-ink-2);margin-top:6px">14px</div>
<div style="font-size:9.5px;color:var(--dr-ink-4);max-width:104px;line-height:1.3">cards, composer</div></div><div style="text-align:center"><div style="width:104px;height:56px;background:var(--dr-surface);border:1px solid var(--dr-line-2);border-radius:var(--dr-r-xl)"></div>
<div style="font-family:var(--dr-font-mono);font-size:10px;color:var(--dr-ink-2);margin-top:6px">18px</div>
<div style="font-size:9.5px;color:var(--dr-ink-4);max-width:104px;line-height:1.3">modals</div></div>
<div style="text-align:center"><div style="width:104px;height:32px;background:var(--dr-surface);border:1px solid var(--dr-line-2);border-radius:999px"></div>
<div style="font-family:var(--dr-font-mono);font-size:10px;color:var(--dr-ink-2);margin-top:6px">999px</div>
<div style="font-size:9.5px;color:var(--dr-ink-4);max-width:104px;line-height:1.3">pills, badges, meters</div></div>
</div></body></html>
