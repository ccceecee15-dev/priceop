<!-- @dsCard group="Colors" viewport="700x150" name="Graphite — every commit action" subtitle="Achromatic on purpose, not a neutral by accident." -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;padding:18px;background:var(--dr-canvas);font-family:var(--dr-font-body);color:var(--dr-ink)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:10px}
.sw{display:flex;flex-direction:column;gap:0;flex:1;min-width:0}
.sw i{height:44px;display:block;border-radius:var(--dr-r-sm) var(--dr-r-sm) 0 0}
.sw b{font-family:var(--dr-font-mono);font-size:9.5px;font-weight:400;color:var(--dr-ink-3);padding:5px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sw em{font-style:normal;font-size:9.5px;color:var(--dr-ink-4);white-space:nowrap}
.note{font-size:11.5px;color:var(--dr-ink-3);line-height:1.5}
</style></head><body class="dr"><div class="row" style="gap:4px;align-items:stretch;max-width:330px" style="gap:4px;align-items:stretch"><div class="sw"><i style="background:var(--dr-action)"></i><b>action</b><em>15.2:1</em></div><div class="sw"><i style="background:var(--dr-action-h)"></i><b>hover</b></div><div class="sw"><i style="background:var(--dr-action-a)"></i><b>pressed</b></div></div><div class="note" style="margin-top:12px">Copper sits at hue 15°, between amber and red. As a button fill it put <em style="font-style:normal;color:var(--dr-ink-2)">commit</em> in the same hue band as <em style="font-style:normal;color:var(--dr-ink-2)">alarm</em> — 39 apart under deuteranopia, below the 40 confusion threshold. Buttons, send, approve, focus rings and meters are all graphite.</div></body></html>
