<!-- @dsCard group="Colors" viewport="700x150" name="Dark shell — the nav rail" subtitle="Dark in both light and dark themes." -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0;padding:18px;background:var(--dr-shell);font-family:var(--dr-font-body)}
.row{display:flex;gap:4px;align-items:stretch}.sw{display:flex;flex-direction:column;flex:1;min-width:0}
.sw i{height:44px;display:block;border-radius:6px 6px 0 0;border:1px solid var(--dr-shell-line)}
.sw b{font-family:var(--dr-font-mono);font-size:9.5px;font-weight:400;color:var(--dr-on-shell-3);padding:5px 0 0}
.note{font-size:11.5px;color:var(--dr-on-shell-2);line-height:1.5;margin-top:10px}</style></head><body class="dr">
<div class="row">
<div class="sw"><i style="background:var(--dr-shell)"></i><b>shell</b></div>
<div class="sw"><i style="background:var(--dr-shell-2)"></i><b>shell-2</b></div>
<div class="sw"><i style="background:var(--dr-shell-3)"></i><b>shell-3</b></div>
<div class="sw"><i style="background:var(--dr-shell-line)"></i><b>shell-line</b></div>
<div class="sw"><i style="background:var(--dr-on-shell)"></i><b>on-shell</b></div>
<div class="sw"><i style="background:var(--dr-on-shell-2)"></i><b>on-shell-2</b></div>
<div class="sw"><i style="background:var(--dr-on-shell-3)"></i><b>on-shell-3</b></div>
<div class="sw"><i style="background:var(--dr-copper-400)"></i><b>copper-400</b></div>
</div>
<div class="note">The rail keeps the app anchored in both themes. Copper-400 (8.3:1 here) carries accents on dark; on-shell-3 is labels only.</div>
</body></html>
