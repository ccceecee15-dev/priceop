<!-- @dsCard group="Type" viewport="700x140" name="The tracked label" subtitle="11px / 700 / .08em uppercase — the system's one all-caps style." -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;padding:18px;background:var(--dr-canvas);font-family:var(--dr-font-body);color:var(--dr-ink)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:10px}
.sw{display:flex;flex-direction:column;gap:0;flex:1;min-width:0}
.sw i{height:44px;display:block;border-radius:var(--dr-r-sm) var(--dr-r-sm) 0 0}
.sw b{font-family:var(--dr-font-mono);font-size:9.5px;font-weight:400;color:var(--dr-ink-3);padding:5px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sw em{font-style:normal;font-size:9.5px;color:var(--dr-ink-4);white-space:nowrap}
.note{font-size:11.5px;color:var(--dr-ink-3);line-height:1.5}
</style></head><body class="dr"><div class="row" style="gap:30px;align-items:flex-start">
<div><label class="dr-field-label">Margin floor</label><input class="dr-input" value="1.40 × cost" style="width:190px"></div>
<div><label class="dr-field-label">Relaxation trigger</label><input class="dr-input" value="≤5 units" style="width:170px"></div>
</div>
<div class="note" style="margin-top:12px">Used above fields, as a small section heading inside a card body, and for menu group labels. Nothing else in the system is uppercase.</div></body></html>
