<!-- @dsCard group="Colors" viewport="700x170" name="Warm neutrals" subtitle="Every grey is warmed — cool greys make the copper look muddy." -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;padding:18px;background:var(--dr-canvas);font-family:var(--dr-font-body);color:var(--dr-ink)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:10px}
.sw{display:flex;flex-direction:column;gap:0;flex:1;min-width:0}
.sw i{height:44px;display:block;border-radius:var(--dr-r-sm) var(--dr-r-sm) 0 0}
.sw b{font-family:var(--dr-font-mono);font-size:9.5px;font-weight:400;color:var(--dr-ink-3);padding:5px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sw em{font-style:normal;font-size:9.5px;color:var(--dr-ink-4);white-space:nowrap}
.note{font-size:11.5px;color:var(--dr-ink-3);line-height:1.5}
</style></head><body class="dr"><div class="row" style="gap:4px;align-items:stretch"><div class="sw"><i style="background:var(--dr-ink)"></i><b>ink</b><em>16.4:1</em></div><div class="sw"><i style="background:var(--dr-ink-2)"></i><b>ink-2</b><em>7.4:1</em></div><div class="sw"><i style="background:var(--dr-ink-3)"></i><b>ink-3</b><em>4.6:1</em></div><div class="sw"><i style="background:var(--dr-ink-4)"></i><b>ink-4</b><em>large only</em></div><div class="sw"><i style="background:var(--dr-canvas)"></i><b>canvas</b></div><div class="sw"><i style="background:var(--dr-surface)"></i><b>surface</b></div><div class="sw"><i style="background:var(--dr-surface-2)"></i><b>surface-2</b></div><div class="sw"><i style="background:var(--dr-surface-3)"></i><b>surface-3</b></div><div class="sw"><i style="background:var(--dr-line)"></i><b>line</b></div><div class="sw"><i style="background:var(--dr-line-2)"></i><b>line-2</b></div></div><div class="note" style="margin-top:10px"><b style="font-family:inherit">ink-4</b> is decorative and large-text only — never body copy. Canvas is the workspace, surface is card white.</div></body></html>
