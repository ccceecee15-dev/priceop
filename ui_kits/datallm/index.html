        '<button class="dr-suggest" data-ask="'+q+'">'+ic(i,'width:16px;height:16px;color:var(--dr-copper-600);flex:none;margin-top:1px')+'<span>'+q+'</span></button>').join('') +
    '</div></div>';

  return topbar('D.A.V.E.', true,
      '<span class="dr-badge dr-badge--brand">'+ic('i-shield','width:12px;height:12px')+' Grounded</span>' +
      '<button class="dr-btn dr-btn--secondary dr-btn--sm">'+ic('i-clock')+'History</button>') +
    page(spine('dave') +
      '<div style="max-width:860px">' + (turns || empty) +
      '<div class="dr-composer" style="margin-top:22px">' +
        '<textarea class="dr-textarea" id="q" placeholder="Ask a question about '+p.name+'\u2026" style="border:0;padding:0;min-height:46px;background:transparent;box-shadow:none"></textarea>' +
        '<div style="display:flex;align-items:center;gap:8px;margin-top:10px">' +
          '<span class="dr-badge dr-badge--neutral">'+p.srcs.length+' source'+(p.srcs.length>1?'s':'')+' in scope</span>' +
          '<span class="dr-badge dr-badge--brand">Grounded</span>' +
          '<button class="dr-composer__send" id="send" aria-label="Send" style="margin-left:auto">'+ic('i-up')+'</button>' +
        '</div></div></div>');
}

/* ---------------- 5. Agent Workbench ---------------- */
function screenWorkbench() {
  const biz = BIZ_AGENTS.map(([n,d,v,ran,recs,out]) =>
    '<div class="dr-card dr-card--interactive">' +
      '<div class="dr-card__head" style="display:flex;gap:12px;align-items:flex-start">' +
        '<div class="dr-hex" style="--hex-size:34px">'+ic('i-node')+'</div>' +
        '<div style="flex:1;min-width:0"><div class="hd" style="font-size:15px">'+n+'</div>' +
        '<div class="dr-table__meta">'+v+' · last run '+ran+'</div></div>' +
        (ran==='Never run' ? '<span class="dr-badge dr-badge--neutral">Idle</span>'
                           : '<span class="dr-badge dr-badge--ok"><i class="dr-dot"></i>Healthy</span>') +
      '</div>' +
      '<div class="dr-card__body"><div style="font-size:12.5px;line-height:1.55;color:var(--dr-ink-2)">'+d+'</div>' +
        '<div style="display:flex;gap:20px;margin-top:14px">' +
          '<div><div class="dr-stat__label">Processed</div><div class="dr-num" style="font-weight:600;font-size:13.5px;margin-top:2px">'+recs+'</div></div>' +
          '<div><div class="dr-stat__label">Outcome</div><div style="margin-top:2px">' +
            (out==='\u2014' ? '<span class="muted" style="font-size:13.5px">\u2014</span>' : '<span class="dr-impact">'+out+'</span>') +
          '</div></div></div></div>' +
      '<div class="dr-card__foot" style="display:flex;gap:8px;align-items:center">' +
        '<button class="dr-btn dr-btn--secondary dr-btn--sm" style="flex:1;justify-content:center">Open</button>' +
        '<button class="dr-btn dr-btn--primary dr-btn--sm" style="flex:1;justify-content:center">'+ic('i-play')+'Run</button>' +
      '</div></div>').join('');

  const comps = '<div class="dr-callout" style="margin-bottom:14px">'+ic('i-info','width:17px;height:17px;flex:none;margin-top:1px;color:var(--dr-copper-600)')+
      '<div><strong>Components carry no business logic.</strong> They are shared plumbing that business agents compose with. A merchandiser does not run these directly.</div></div>' +
    '<div class="dr-card" style="overflow:hidden"><table class="dr-table">' +
      '<thead><tr><th>Component</th><th>What it does</th><th style="text-align:right">Version</th></tr></thead><tbody>' +
      COMPONENTS.map(([n,d,v]) => '<tr><td style="font-weight:600;white-space:nowrap">'+n+'</td>' +
        '<td style="color:var(--dr-ink-2)">'+d+'</td><td class="dr-num muted" style="text-align:right">'+v+'</td></tr>').join('') +
      '</tbody></table></div>';

  return topbar('Agent Workbench', true,
      '<button class="dr-btn dr-btn--secondary dr-btn--sm">'+ic('i-cal')+'Schedule</button>' +
      '<button class="dr-btn dr-btn--primary dr-btn--sm">'+ic('i-plus')+'Register agent</button>') +
    page(spine('workbench') +
      '<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(190px,1fr));margin-bottom:20px">' +
        [['Runs this month','38','across 4 business agents'],['Records processed','1.3M','SKUs, suppliers and stores'],
         ['Margin protected','\u00a314.2k','Markdown agent, 5 styles'],['Awaiting approval','55','nothing auto-executes']].map(([l,v,b]) =>
          '<div class="dr-card" style="padding:16px 18px"><div class="dr-stat__label">'+l+'</div>' +
          '<div class="dr-kpi__value" style="font-size:28px;margin-top:5px">'+v+'</div><div class="dr-bench">'+b+'</div></div>').join('') + '</div>' +
      '<div class="dr-tabs" style="margin-bottom:18px">' +
        '<button class="dr-tab '+(state.wbTab==='business'?'dr-tab--active':'')+'" data-wb="business">Business agents <span style="font-weight:500;color:var(--dr-ink-3)">4</span></button>' +
        '<button class="dr-tab '+(state.wbTab==='components'?'dr-tab--active':'')+'" data-wb="components">Components <span style="font-weight:500;color:var(--dr-ink-3)">7</span></button>' +
      '</div>' +
      (state.wbTab==='business'
        ? '<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(330px,1fr))">'+biz+'</div>'
        : comps));
}

/* ---------------- 6. AI Compass ---------------- */
function screenCompass() {
  const p = P();
  const dri = p.dri || 0;
  const viable = USE_CASES.filter(u => u.need <= dri);
  const locked = USE_CASES.filter(u => u.need > dri);
  const sum = a => a.reduce((t,u) => t + parseInt(u.roi.replace(/[^0-9]/g,''),10), 0);

  const row = (u, ok) =>
    '<div class="dr-card" style="padding:16px 18px;display:flex;gap:16px;align-items:center;'+(ok?'':'background:var(--dr-surface-2)')+'">' +
      '<div class="dr-hex '+(ok?'':'dr-hex--soft')+'" style="--hex-size:32px">'+ic(ok?'i-zap':'i-lock')+'</div>' +
      '<div style="flex:1;min-width:0"><div style="font-weight:600;font-size:13.5px">'+u.name+'</div>' +
        '<div class="dr-table__meta">'+u.dept+' · '+u.eff+' to build · '+u.why+'</div></div>' +
      '<div style="text-align:right;white-space:nowrap"><div class="dr-num" style="font-family:var(--dr-font-display);font-size:18px;font-weight:600">'+u.roi+'</div>' +
        '<div class="dr-table__meta">needs '+u.need.toFixed(2)+'</div></div>' +
      (ok ? '<button class="dr-btn dr-btn--primary dr-btn--sm">Start</button>'
          : '<button class="dr-btn dr-btn--secondary dr-btn--sm" data-go="dri">Fix in DRI</button>') +
    '</div>';

  return topbar('AI Compass', true,
      '<button class="dr-btn dr-btn--secondary dr-btn--sm">'+ic('i-dl')+'Export business case</button>') +
    page(spine('workbench') +
      '<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-bottom:20px">' +
        '<div class="dr-card" style="padding:18px 20px;background:var(--dr-copper-050);border-color:var(--dr-copper-200)">' +
          '<div class="dr-stat__label">Identified value</div><div class="dr-kpi__value" style="font-size:30px;margin-top:4px">\u00a32.2m</div>' +
          '<div class="dr-bench">Across 7 use cases, all departments</div></div>' +
        '<div class="dr-card" style="padding:18px 20px"><div class="dr-stat__label">Viable now</div>' +
          '<div class="dr-kpi__value" style="font-size:30px;margin-top:4px">\u00a3'+sum(viable)+'k</div>' +
          '<div class="dr-bench">'+viable.length+' use cases at readiness '+dri.toFixed(2)+'</div></div>' +
        '<div class="dr-card" style="padding:18px 20px"><div class="dr-stat__label">Blocked</div>' +
          '<div class="dr-kpi__value" style="font-size:30px;margin-top:4px">\u00a3'+sum(locked)+'k</div>' +
          '<div class="dr-bench">'+locked.length+' use cases, each naming the dimension in the way</div></div>' +
      '</div>' +
      '<div class="dr-sec"><h3>Viable at '+dri.toFixed(2)+'</h3><span class="dr-sec__count">Readiness is sufficient — these can start now</span></div>' +
      '<div class="grid" style="grid-template-columns:1fr;gap:9px;margin-bottom:22px">'+viable.map(u=>row(u,true)).join('')+'</div>' +
      '<div class="dr-sec"><h3>Blocked by readiness</h3><span class="dr-sec__count">Each shows the dimension short, and by how much</span></div>' +
      '<div class="grid" style="grid-template-columns:1fr;gap:9px">'+locked.map(u=>row(u,false)).join('')+'</div>');
}

/* ---------------- 7. Data Explorer ---------------- */
function screenExplorer() {
  return topbar('Data Explorer', true, '<button class="dr-btn dr-btn--primary dr-btn--sm">'+ic('i-play')+'Run query</button>') +
    page(spine('explorer') +
      '<div style="max-width:760px;margin-bottom:20px">' +
        '<div class="hd" style="font-size:26px;margin-bottom:8px">One query. Whichever engine each source needs.</div>' +
        '<div style="font-size:14px;line-height:1.6;color:var(--dr-ink-2)">Federation is resolved for you: Postgres, SharePoint, an Outlook archive and two spreadsheets answer the same statement. You do not move the data first.</div>' +
      '</div>' +
      '<div class="dr-card" style="margin-bottom:16px">' +
        '<div class="dr-card__head"><label class="dr-field-label" style="margin:0">Query</label></div>' +
        '<div class="dr-card__body" style="padding:0">' +
          '<textarea class="dr-textarea" style="border:0;border-radius:0;min-height:96px;font-family:var(--dr-font-mono);font-size:12.5px;line-height:1.7">select s.style_id, s.on_hand, c.lead_time_days, m.thread_count\nfrom   WHS_Retail_DW.stock s\n  join Supplier_Contracts.terms   c using (supplier_id)\n  join Buying_Team_Mailbox.threads m using (supplier_id)\nwhere  s.on_hand &gt; 0</textarea>' +
        '</div>' +
        '<div class="dr-card__foot" style="display:flex;gap:8px;align-items:center">' +
          '<span class="dr-src">'+ic('i-db')+'PostgreSQL 15'+'</span>' +
          '<span class="dr-src">'+ic('i-cloud')+'SharePoint'+'</span>' +
          '<span class="dr-src">'+ic('i-mail')+'Outlook archive'+'</span>' +
          '<span class="muted" style="font-size:11.5px;margin-left:auto">3 engines · planned in 240 ms</span></div>' +
      '</div>' +
      '<div class="dr-card" style="overflow:hidden"><table class="dr-table">' +
        '<thead><tr><th>style_id</th><th style="text-align:right">on_hand</th><th style="text-align:right">lead_time_days</th><th style="text-align:right">thread_count</th></tr></thead><tbody>' +
        [['2809424',305,42,18],['1386384','20,531',28,4],['2867882','9,913',35,11],['2809418','3,290',51,26]].map(r =>
          '<tr><td class="dr-num">'+r[0]+'</td><td class="dr-num" style="text-align:right">'+r[1]+'</td>' +
          '<td class="dr-num" style="text-align:right">'+r[2]+'</td><td class="dr-num" style="text-align:right">'+r[3]+'</td></tr>').join('') +
        '</tbody></table></div>');
}

/* ---------------- command palette ---------------- */
function cmdk() {
  if (!state.cmdk) return '';
  const g = (label, items) => '<div class="dr-cmdk__group">'+label+'</div>' + items.map(([i,l,m,go]) =>
    '<button class="dr-cmdk__row" data-go="'+go+'">'+ic(i)+'<span style="flex:1">'+l+'</span>' +
    (m?'<span style="font-size:11.5px;color:var(--dr-ink-3)">'+m+'</span>':'')+'</button>').join('');
  return '<div class="dr-overlay" id="cmdk-bg"><div class="dr-modal dr-cmdk" onclick="event.stopPropagation()">' +
    '<input class="dr-cmdk__input" placeholder="Search profiles, sources, screens\u2026" autofocus>' +
    '<div style="padding:4px 6px 12px">' +
      g('Profiles', PROFILES.map((p,i) => ['i-layers', p.name, p.dri ? 'DRI '+p.dri.toFixed(2) : 'not assessed', 'home'])) +
      g('Sources', SOURCES.slice(0,3).map(s => [s.icon, s.name, s.fmt, 'connectors'])) +
      g('Screens', NAV.slice(2,6).map(([k,l,i]) => [i, l, '', k])) +
    '</div></div></div>';
}

/* ---------------- render + events ---------------- */
const SCREENS = { home:screenHome, connectors:screenConnectors, explorer:screenExplorer,
                  dri:screenDri, dave:screenDave, workbench:screenWorkbench, compass:screenCompass };

function render() {
  document.getElementById('app').innerHTML =
    rail() + '<main style="flex:1;min-width:0;display:flex;flex-direction:column">' +
    (SCREENS[state.screen] || screenHome)() + '</main>' + cmdk();
}

document.addEventListener('click', e => {
  const go = e.target.closest('[data-go]');
  const prof = e.target.closest('[data-profile]');
  const wb = e.target.closest('[data-wb]');
  const ask = e.target.closest('[data-ask]');
  const cm = e.target.closest('[data-cmdk]');
  const cycle = e.target.closest('[data-cycle]');

  if (e.target.id === 'cmdk-bg') { state.cmdk = false; return render(); }
  if (cm) { state.cmdk = true; return render(); }
  if (cycle) { state.profile = (state.profile + 1) % PROFILES.length; state.convo = []; return render(); }
  if (ask) { state.convo = [{me:true,text:ask.dataset.ask},
      {me:false,text:'61 of 110 stores miss the exit date at their current rate of sale. The 44 in cluster C clear if MD1 opens a week early; the 17 in cluster D need the full ladder.'}];
      state.screen = 'dave'; return render(); }
  if (wb) { state.wbTab = wb.dataset.wb; return render(); }
  if (prof) { state.profile = +prof.dataset.profile; state.convo = []; return render(); }
  if (go) { state.screen = go.dataset.go; state.cmdk = false; return render(); }
});

document.addEventListener('click', e => {
  if (e.target.closest('#send')) {
    const q = document.getElementById('q');
    if (q && q.value.trim()) {
      state.convo = state.convo.concat([{me:true,text:q.value.trim()},
        {me:false,text:'Answered against '+P().srcs.length+' source'+(P().srcs.length>1?'s':'')+' in '+P().name+'. Lineage below shows which, and how much of each was read.'}]);
      render();
    }
  }
});

document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); state.cmdk = !state.cmdk; render(); }
  if (e.key === 'Escape' && state.cmdk) { state.cmdk = false; render(); }
});

render();
</script>
</body>
